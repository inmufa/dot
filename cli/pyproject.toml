[project]
name = "dot-cli"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["dot-contracts", "textual>=0.80", "httpx>=0.27"]

[project.scripts]
dot = "dot_cli.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
dot-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dot_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
