[project]
name = "dot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dot-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6",  # skill frontmatter
    "bashlex>=0.18",
    "trafilatura>=2.0",  # WebFetch html -> markdown (already locked via dot-browser)
    "python-multipart>=0.0.9",  # multipart parsing for attachment uploads
    "pillow>=10",  # downscale images before they go to the vision model
    "mcp>=1.30,<2",  # official MCP client SDK (spec 4.3)
    "cryptography>=43",  # AES-256-GCM for the credential vault (no stdlib AEAD)
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "dot-sandbox"]

[tool.uv.sources]
dot-contracts = { workspace = true }
dot-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: real-protocol smoke tests (fake llama-server, real sandbox)"]
