# CI only: tests, lint, image build verification. Nothing is pushed or deployed.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, path: backend/tests, args: '-m "not integration"' }
          - { name: sandbox-runner, path: services/sandbox-runner/tests, args: "" }
          - { name: browser-worker, path: services/browser-worker/tests, args: "" }
          - { name: cli, path: cli/tests, args: "" }
          - { name: deploy, path: deploy/tests, args: "" }
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run pytest ${{ matrix.path }} ${{ matrix.args }} -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run pytest backend/tests -m integration -q

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  docker-build:
    # Build verification only: push is off, images are not stored.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: backend, context: ., file: deploy/docker/backend/Dockerfile }
          - { image: sandbox, context: ., file: deploy/docker/sandbox/Dockerfile }
          - { image: browser, context: ., file: deploy/docker/browser/Dockerfile }
          - { image: web, context: services/web-ui, file: deploy/docker/web/Dockerfile }
    name: docker build (${{ matrix.image }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  ci-ok:
    if: always()
    needs: [lint, test, integration, web-ui, docker-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1 || exit 0
